[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unichat"
version = "0.1.0"
description = "Fetch and visualize chat messages from Mattermost, Slack and (partially) Discord"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
    "python-dateutil>=2.9",
    "pyarrow>=25.0.1",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]
slack-cookie = ["cramjam>=2.8"]   # only for `import-slack` when Slack's blob is compressed

[project.scripts]
unichat = "unichat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unichat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
